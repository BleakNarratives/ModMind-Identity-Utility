    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* AURORA BACKGROUND */
      .aurora-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -1;
        background-color: #020617; /* slate-950 */
        overflow: hidden;
      }
      .aurora-bg::before, .aurora-bg::after {
        content: '';
        position: absolute;
        width: 100vmin;
        height: 100vmin;
        border-radius: 50%;
        animation: rotate 20s linear infinite;
        filter: blur(80px);
        opacity: 0.3;
      }
      .aurora-bg::before {
        background-image: radial-gradient(circle, #be123c, transparent 60%);
        top: -20%;
        left: -20%;
      }
      .aurora-bg::after {
        background-image: radial-gradient(circle, #4f46e5, transparent 60%);
        bottom: -20%;
        right: -20%;
        animation-delay: -10s;
      }
      @keyframes rotate {
        from { transform: rotate(0deg) scale(1); }
        to { transform: rotate(360deg) scale(1.2); }
      }

      /* ENTRANCE & GLITCH ANIMATIONS */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
      
      @keyframes glitch {
        0% { text-shadow: 0 0 5px #ff0000, 0 0 10px #00ff00, 0 0 15px #0000ff; }
        25% { text-shadow: none; }
        50% { text-shadow: 0 0 5px #ff0000, 0 0 10px #00ff00, 0 0 15px #0000ff; }
        75% { text-shadow: none; }
        100% { text-shadow: none; }
      }
      .animate-glitch {
        animation: glitch 0.4s steps(1, end);
      }
    </style>
